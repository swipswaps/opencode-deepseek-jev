# Docker Compose definition for the OpenCode + DeepSeek + Jev image.
#
# Two modes:
#
#   TUI     docker compose run --rm opencode
#   Web     docker compose up -d opencode-web
#
# The web service publishes port 4096 and reads OPENCODE_SERVER_PASSWORD
# from the host environment. If unset, the server has no auth; do not
# expose to an untrusted network in that case.
#
# References:
#   https://opencode.ai/docs/web/
#   https://opencode.ai/docs/server/
#   https://docs.docker.com/compose/compose-file/

services:
  opencode:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: opencode-deepseek-jev:robust
    container_name: opencode-deepseek-jev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["/workspace/docker/jev-off-entrypoint.sh"]
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ../data/opencode:/home/node/.local/share/opencode
      - /home/owner/Documents/9e3e0363-0237-4c38-93dc-ce25e2f1ec37/notes:/workspace/notes:ro
    env_file:
      - ../.env.local
    environment:
      - DEEPSEEK_API_KEY
      - JEV_API_KEY
      - JEV_BASE_URL
      - JEV_BASE_API_KEY
      - GEMINI_API_KEY
      - OPENCODE_DISABLE_DEFAULT_PLUGINS=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  opencode-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: opencode-deepseek-jev:robust
    container_name: opencode-deepseek-web
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    entrypoint: ["/workspace/docker/web-entrypoint.sh"]
    expose:
      # Reached only by the caddy service on the compose network.
      - "4096"
      - "5099"
    volumes:
      - ..:/workspace
      - ../data/opencode:/home/node/.local/share/opencode
    env_file:
      - ../.env.local
    environment:
      OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
    restart: unless-stopped
    # Release the caddy dependency only once the upstream actually answers.
    # Compose otherwise waits for "created/running", not "ready"
    # (https://docs.docker.com/compose/how-tos/startup-order/), which is how
    # caddy used to start into a 502 window during a restart. :4096 returns
    # 401 behind Basic auth, so the check accepts 200 OR 401 (RFC 7235 §4.1).
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4096/api/health | grep -qE '^(200|401)$$'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  caddy:
    image: caddy:2-alpine
    container_name: opencode-caddy
    user: "1000:1000"
    # Publish on the wildcard address (all interfaces). Docker binds 0.0.0.0,
    # which always exists, so a roaming laptop whose LAN/tailscale/nebula IP is
    # absent at start can never fail this container with EADDRNOTAVAIL. Every
    # present interface (loopback, LAN, Nebula 10.100.0.24, Tailscale) reaches
    # it; auth is enforced by web-entrypoint.sh and TLS by the Caddyfile.
    # Do NOT pin individual host IPs here: one missing IP aborted the whole
    # published port set and took the overlay clients down with it.
    ports:
      - "4096:4096"
      - "5099:5099"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      opencode-web:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy-data:
  caddy-config:
