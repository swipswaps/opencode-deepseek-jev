# LiteLLM proxy config — add hard budget caps, rate limits, and a unified
# cost dashboard in front of DeepSeek. Optional; see HANDOFF.md.
#
# Docs: https://docs.litellm.ai/docs/proxy/configs
# Budgets: https://docs.litellm.ai/docs/budget_manager
#
model_list:
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      # Absorb transient upstream congestion (429/503 "backend
      # temporarily overloaded") at the proxy instead of failing
      # every client on the first blip. num_retries semantics:
      # https://docs.litellm.ai/docs/completion/reliable_completions
      num_retries: 3

  - model_name: deepseek-flash-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      num_retries: 3

  - model_name: deepseek-flash-4.1
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      num_retries: 3

  # Claude: ASK-tier, deliberation-only (RULES #68). Present here so its COST is
  # tracked/capped if ever routed, but it must never be the default. Use
  # scripts/ask-claude.py (gated) rather than pointing the agent at it.
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5   # set the exact id for your account
      api_key: os.environ/ANTHROPIC_API_KEY
      num_retries: 1

# Failover order for transient upstream 401/429/503 (DeepSeek governor
# blips, congestion). First entry is tried first; litellm advances on
# retryable errors. Keeps the TUI on a working model without re-picking.
fallbacks:
  - deepseek-flash: [deepseek-flash-pro, deepseek-flash-4.1]
  - deepseek-flash-4.1: [deepseek-flash-pro, deepseek-flash]
  - deepseek-flash-pro: [deepseek-flash]

# Spend persistence (enables the max_budget cap + admin UI history).
# NOT active: requires a Postgres the compose stack does not run yet.
# Host enable path: add a postgres service, set DATABASE_URL below to
# os.environ/LITELLM_DATABASE_URL, recreate litellm. Until then max_budget
# stays decorative (see note under litellm_settings).
# general_settings:
#   database_url: os.environ/LITELLM_DATABASE_URL

litellm_settings:
  # Hard cap in USD. 30d = rolling 30 days; also: 1d, 1h.
  # Budgets / virtual keys: https://docs.litellm.ai/docs/proxy/virtual_keys
  # NOTE (measured 2026-09-30): the proxy logs that a proxy-wide budget is
  # NOT enforced without DATABASE_URL — max_budget below is currently
  # decorative. Wiring spend persistence is queued (G4 follow-up).
  max_budget: 5.0
  budget_duration: 30d
  request_timeout: 120
